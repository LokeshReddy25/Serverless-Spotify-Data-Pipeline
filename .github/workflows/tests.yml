name: tests

# Lint and unit tests on every push and pull request.
# No AWS credentials or repository secrets are used: every AWS call in the test suite goes to
# moto's in-memory mock, and tests/conftest.py sets moto's placeholder values itself.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: python -m flake8 .

      - name: Unit tests (pytest + moto, no AWS)
        run: python -m pytest --cov --cov-report=term-missing
